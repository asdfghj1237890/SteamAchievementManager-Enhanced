version: 2

# Legacy WinForms projects (SAM.API/, SAM.Game/, SAM.Picker/) are intentionally
# not covered — see CLAUDE.md, legacy design concerns are out of scope.
updates:
  # React + Vite frontend
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and @vitest/* pin each other as exact-version peers, so a major
      # bump has to land in one PR (#43 and #44 could never pass alone; see #45).
      # Listed first so it takes precedence over the dev-dependencies group.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Tauri host crate
  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Steam client FFI crate
  - package-ecosystem: cargo
    directory: /web/steam-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Release workflow actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
