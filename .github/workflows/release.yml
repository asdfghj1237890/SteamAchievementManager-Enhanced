name: Release

# Build the Windows portable .exe and the macOS (Apple Silicon) .dmg, then attach
# BOTH to a single GitHub Release. Triggers on pushing a version tag like `v1.0.0`,
# or manually via the Actions tab. The two builds run in parallel and upload their
# binaries as workflow artifacts; a final `release` job publishes once — so there is
# no create-race between platforms and the release always gets both assets.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Created on the current commit if it does not exist.'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

# The release tag. Scripts read it as "$TAG" instead of having the expression pasted
# into their source: a manually dispatched tag is free text, and text substituted
# into a `run:` script is parsed by the shell as code.
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Releases reuse the same full test matrix as pull requests, so a tag cannot
  # publish by bypassing browser, Rust, accessibility, or native smoke gates.
  quality:
    uses: ./.github/workflows/test.yml

  # Fail fast if the git tag and the app's own version (what getVersion() reports)
  # disagree — otherwise a release built without bumping the version files would
  # immediately nag users to "update" to the version they just installed.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the app version
        run: |
          tag="$TAG"
          want="${tag#v}"
          conf=$(jq -r '.version' web/src-tauri/tauri.conf.json)
          pkg=$(jq -r '.version' web/package.json)
          if [ "$want" != "$conf" ] || [ "$want" != "$pkg" ]; then
            echo "::error::tag $tag (=$want) != versions (tauri.conf.json=$conf, package.json=$pkg). Bump both to $want before tagging."
            exit 1
          fi
          echo "version OK: $want"

  build-windows:
    needs: [verify-version, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No Swatinem/rust-cache here (test.yml keeps it): the job that signs compiles
      # from scratch instead of restoring a target/ directory written by an earlier
      # run. A cache saved by a tag run is never restored by another tag, so it only
      # ever sped up re-runs of the same tag.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
      # --ignore-scripts: no dependency's install script runs in the signing job. The
      # build needs none (the only one in package-lock.json is the optional fsevents).
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Release packages must be minisign-signed for the in-app updater — add the private key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repository secrets (see web/TESTING.md, Releases and updates)."
            exit 1
          fi
      # Compile and sign are separate steps so the updater signing key stays
      # confidential: this step runs all the third-party build-time code — the
      # frontend build (tsc, vite and its plugins) and cargo (every crate's build.rs
      # and proc-macros) — and has NO key in its environment. npm consumes the first
      # `--`; tauri hands what follows the second one to cargo, so `--locked` makes
      # cargo build exactly the committed Cargo.lock or fail.
      # Limit: the split only stops build-time code from reading the key out of its
      # own environment; it does not make the artifact trustworthy. Both steps share
      # one runner, so a malicious build-time dependency can still tamper with the
      # app.exe that the next step packages and signs, or reach the key indirectly by
      # persisting into that step: through GITHUB_PATH / GITHUB_ENV, or by replacing
      # what it runs (node_modules, the tauri CLI binary). Full isolation would need
      # a separate signing job on a fresh runner.
      # The timeout is for a hung build: this one is cold (no rust-cache, fat LTO),
      # and without a limit it would run to the 6-hour job default.
      - name: Compile the release executable (no signing key)
        working-directory: web
        shell: bash
        timeout-minutes: 60
        run: npm run tauri -- build --no-bundle -- --locked
      # Two Windows assets from that one compile: the portable single .exe
      # (target/release/app.exe) and the NSIS installer the in-app updater installs
      # from. `tauri bundle` packages the already-compiled executable — it does not
      # rerun the frontend build or cargo — and createUpdaterArtifacts signs the
      # installer with the minisign key and writes the .sig next to it; the step
      # fails if the key is missing. Apart from the emptiness check above, this is
      # the only step that gets the key.
      - name: Bundle and sign the NSIS installer
        working-directory: web
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --bundles nsis
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            web/src-tauri/target/release/app.exe
            web/src-tauri/target/release/bundle/nsis/*-setup.exe
            web/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  build-macos:
    needs: [verify-version, quality]
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No Swatinem/rust-cache and no install scripts, as in build-windows.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Require the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Release packages must be minisign-signed for the in-app updater — add the private key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repository secrets (see web/TESTING.md, Releases and updates)."
            exit 1
          fi
      # Same split as build-windows, for the same reason: the frontend build and
      # cargo (build scripts, proc-macros) run here WITHOUT the updater signing key,
      # and `--locked` pins cargo to the committed Cargo.lock. The same limit applies:
      # build-time code cannot read the key from its environment, but on this shared
      # runner it can still tamper with the binary that the next step bundles and
      # signs, or persist into that step (GITHUB_PATH / GITHUB_ENV, node_modules, the
      # tauri CLI binary) and reach the key there; only a separate signing job on a
      # fresh runner would rule that out. Same timeout, for a hung cold build. Host
      # target on macos-latest is aarch64-apple-darwin, so this is an Apple Silicon build.
      - name: Compile the release binary (no signing key, Apple Silicon)
        working-directory: web
        timeout-minutes: 60
        run: npm run tauri -- build --no-bundle -- --locked
      # Bundles the already-compiled binary into "SAM Enhanced.app" and a .dmg for
      # manual installs, plus the signed .app.tar.gz the in-app updater installs from.
      # Apart from the emptiness check above, this is the only step that gets the key;
      # `tauri bundle` does not rerun the frontend build or cargo.
      # The .dmg window layout (background, icon positions from bundle.macOS.dmg) is
      # applied by an AppleScript that drives Finder. Tauri skips that script whenever
      # CI=true, which ships a bare, default-sized window; TAURI_BUNDLER_DMG_IGNORE_CI
      # turns it back on. The timeout guards against a Finder AppleEvent that hangs.
      - name: Bundle .dmg and signed updater bundle
        working-directory: web
        timeout-minutes: 45
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: npm run tauri -- bundle --bundles app dmg
      # Finder writes the layout into the volume's .DS_Store. No .DS_Store (or one that
      # does not reference the background) means the AppleScript silently did not run.
      - name: Verify the .dmg window layout was applied
        working-directory: web/src-tauri/target/release/bundle/dmg
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" *.dmg >/dev/null
          trap 'hdiutil detach "$mnt" -quiet' EXIT
          if [ ! -f "$mnt/.background/background.tiff" ] || ! grep -qa 'background.tiff' "$mnt/.DS_Store" 2>/dev/null; then
            echo "::error::The .dmg has no Finder layout (background/icon positions) — the DMG AppleScript did not run."
            exit 1
          fi
          echo "dmg layout OK"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: |
            web/src-tauri/target/release/bundle/dmg/*.dmg
            web/src-tauri/target/release/bundle/macos/*.app.tar.gz
            web/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts # -> artifacts/windows/**, artifacts/macos/**

      # This job otherwise has no checkout — the repo ROOT contains an unrelated
      # latest.json (the pointer for <1.4 clients), so it stays untouched by confining
      # this checkout to repo/ (sparse, just the script) instead of the job's default
      # working directory, where the stage step below writes ITS OWN latest.json.
      - name: Checkout release-manifest script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
          sparse-checkout: |
            web/scripts/release-manifest.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Assets get tag-stamped names; the updater manifest below points at the
      # renamed files, so the names and the manifest can never drift apart.
      - name: Stage release assets, updater manifest, and checksums
        id: stage
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag#v}"
          base="SteamAchievementManager-Enhanced-${tag}"
          win="${base}-windows-x64.exe"
          win_setup="${base}-windows-x64-setup.exe"
          mac="${base}-macos-arm64.dmg"
          mac_bundle="${base}-macos-arm64.app.tar.gz"
          one() { local f; f=$(find "$1" -type f -name "$2" | head -1); [ -n "$f" ] || { echo "::error::no $2 under $1"; exit 1; }; printf '%s' "$f"; }
          cp "$(one artifacts/windows 'app.exe')" "$win"
          cp "$(one artifacts/windows '*-setup.exe')" "$win_setup"
          cp "$(one artifacts/windows '*-setup.exe.sig')" "$win_setup.sig"
          cp "$(one artifacts/macos '*.dmg')" "$mac"
          cp "$(one artifacts/macos '*.app.tar.gz')" "$mac_bundle"
          cp "$(one artifacts/macos '*.app.tar.gz.sig')" "$mac_bundle.sig"

          # Updater manifest (Tauri v2 static JSON): the app fetches it from
          # releases/latest/download/latest.json, verifies the package signature
          # against the public key built into the app, and only then installs.
          # Built by web/scripts/release-manifest.mjs (unit-tested in
          # web/src/__tests__/releaseManifest.test.ts) instead of inline jq, so a
          # mistake here — a signature with a stray newline, a platform key typo, a
          # downgrade-guard bug — is caught locally instead of only on a real release.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          node repo/web/scripts/release-manifest.mjs build \
            --version "$version" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --win-url "$url/$win_setup" --win-sig "$win_setup.sig" \
            --mac-url "$url/$mac_bundle" --mac-sig "$mac_bundle.sig" \
            > latest.json
          # Fail closed: never publish a manifest that is empty, for another version, or
          # missing a platform's package URL or signature.
          jq -e --arg v "$version" '.version == $v and ([.platforms["windows-x86_64", "darwin-aarch64"] | .url, .signature | strings | length > 0] | length == 4 and all)' latest.json > /dev/null \
            || { echo "::error::latest.json is incomplete"; cat latest.json; exit 1; }

          # SHA-256 of every asset, for anyone verifying a manual download.
          sha256sum "$win" "$win_setup" "$win_setup.sig" "$mac" "$mac_bundle" "$mac_bundle.sig" latest.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "assets=$win $win_setup $win_setup.sig $mac $mac_bundle $mac_bundle.sig latest.json SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      # Single publisher, so a plain exists-check is race-free. Re-runnable: an
      # existing release (e.g. manual dispatch on an old tag) gets its assets
      # replaced via --clobber.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ steps.stage.outputs.tag }}
          STAGE_ASSETS: ${{ steps.stage.outputs.assets }}
        run: |
          tag="$STAGE_TAG"
          assets="$STAGE_ASSETS"
          notes=$'Cross-platform build.\n\n## Windows\n- **Installer** (`…-windows-x64-setup.exe`, recommended): per-user install, no admin rights needed. From this version on it updates itself from inside the app.\n- **Portable** (`…-windows-x64.exe`): double-click it — no installation. A portable copy cannot update itself; the app offers this page instead.\n\nBoth need Windows 10/11 with the WebView2 runtime (preinstalled on current Windows).\n\n## macOS (Apple Silicon)\nDownload the `.dmg`, open it, and drag `SAM Enhanced` into Applications. This build is **unsigned**, so on first launch right-click the app -> Open -> Open, or run `xattr -cr "/Applications/SAM Enhanced.app"` once. Once installed it updates itself from inside the app.\n\n## Verifying a download\n`SHA256SUMS.txt` lists the SHA-256 of every asset. Windows: `certutil -hashfile <file> SHA256`. macOS: `shasum -a 256 <file>`. In-app updates are verified automatically: each package carries a minisign signature (`.sig`) that the app checks against the public key built into it before installing.\n\nBoth platforms require Steam installed, running, and logged in.\n\n⚠️ This writes to your real Steam account when you unlock achievements or edit stats.'
          # This job has no checkout, so gh has no local git remote to infer the
          # repo from — pass it explicitly or `gh release` fails with
          # "not a git repository".
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag exists — uploading assets."
            # shellcheck disable=SC2086 # intentional word splitting of the asset list
            gh release upload "$tag" $assets --repo "$repo" --clobber
          else
            echo "Creating release $tag."
            # shellcheck disable=SC2086
            gh release create "$tag" $assets --repo "$repo" --title "$tag" --notes "$notes"
          fi

  bump-latest-json:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize latest.json updates so concurrent/overlapping release runs can't
    # race each other when pushing the pointer.
    concurrency:
      group: latest-json
      cancel-in-progress: false
    steps:
      # The only checkout that keeps its credentials: this job pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Write latest.json from the release tag and push (monotonic)
        run: |
          tag="$TAG"
          new="${tag#v}"
          cur=$(jq -r '.version // "0.0.0"' latest.json 2>/dev/null || echo "0.0.0")
          # Refuse to downgrade: only write when new >= cur, so re-running an older
          # tag's release can't push an older version over a newer one. Same guard as
          # web/scripts/release-manifest.mjs's shouldWriteVersion (unit-tested in
          # web/src/__tests__/releaseManifest.test.ts), instead of a bare `sort -V`.
          decision=$(node web/scripts/release-manifest.mjs check-version --new "$new" --current "$cur")
          case "$decision" in
            write) ;;
            refuse)
              echo "latest.json is at $cur; refusing to write older $new."
              exit 0
              ;;
            *)
              echo "::error::check-version gave '$decision' for $new vs $cur"
              exit 1
              ;;
          esac
          printf '{ "version": "%s" }\n' "$new" > latest.json
          if git diff --quiet -- latest.json; then
            echo "latest.json already at $new — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "ci: bump latest.json to $new"
          git push origin HEAD:master
