[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["vendor/urlpattern-compat"]
resolver = "2"

# Release profile (profiles only count at the workspace root, so this also covers the
# steam-core path dependency): fat LTO + one codegen unit for a smaller, faster
# binary — app.exe is re-spawned as the per-game worker, so its size sits on the
# open/save path — and symbols stripped. `panic = "abort"` is deliberately NOT set:
# a panic inside a spawn_blocking command currently surfaces as an error toast, and
# aborting the whole app instead would be a robustness regression around raw FFI.
[profile.release]
codegen-units = 1
lto = true
strip = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
steam-core = { path = "../steam-core" }
ureq = "3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

# Tauri 2.11 still constrains `urlpattern` to the 0.3 series, which depends on
# the unmaintained UNIC crates. This compatibility package preserves the 0.3
# version contract while re-exporting the maintained 0.6 implementation.
[patch.crates-io]
urlpattern = { path = "vendor/urlpattern-compat" }
