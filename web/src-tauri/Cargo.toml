[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["vendor/urlpattern-compat"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
steam-core = { path = "../steam-core" }
ureq = "2"

# Tauri 2.11 still constrains `urlpattern` to the 0.3 series, which depends on
# the unmaintained UNIC crates. This compatibility package preserves the 0.3
# version contract while re-exporting the maintained 0.6 implementation.
[patch.crates-io]
urlpattern = { path = "vendor/urlpattern-compat" }
