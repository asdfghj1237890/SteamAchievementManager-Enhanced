<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Background of the macOS .dmg install window (660×400 pt, see bundle.macOS.dmg in
    tauri.conf.json). Finder always draws the icon labels in black over a background
    picture — even in Dark Mode — so this has to stay light. Finder's window bounds
    include the title bar, so the bottom ~32 pt are hidden; keep content above y≈340.
    Icon centres: app (170,140), Applications (490,140).
    Regenerate background.tiff after editing: node scripts/dmg-background.mjs
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="170" cy="140" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cf3a50" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#cf3a50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="490" cy="140" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3bd47" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f3bd47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="246" y1="0" x2="406" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cf3a50"/>
      <stop offset="1" stop-color="#e7a838"/>
    </linearGradient>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glowRed)"/>
  <rect width="660" height="400" fill="url(#glowGold)"/>

  <!-- drag arrow: dotted shaft + rounded chevron -->
  <g fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 140 H392" stroke-width="5" stroke-dasharray="0.1 13"/>
    <path d="M388 127 L402 140 L388 153" stroke-width="5"/>
  </g>

  <g text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'PingFang TC', 'Helvetica Neue', sans-serif">
    <text x="330" y="295" font-size="15" font-weight="600" fill="#12202e">拖曳 SAM Enhanced 到 Applications 即可安裝</text>
    <text x="330" y="317" font-size="12.5" fill="#506275">Drag SAM Enhanced onto Applications to install</text>
  </g>
</svg>
